name: Check Config Names

on:
  push:
    branches:
      - master
      - demo
  pull_request:
    branches:
      - master
      - demo

jobs:
  verify-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine branch and set variables
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          echo "Target branch resolved to: $TARGET_BRANCH"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV

          if [ "$TARGET_BRANCH" = "master" ]; then
            echo "EXPECTED_WRANGLER_NAME=ffneumarkt-web" >> $GITHUB_ENV
            echo "EXPECTED_ASTRO_SITE=https://ffneumarkt.at" >> $GITHUB_ENV
          elif [ "$TARGET_BRANCH" = "demo" ]; then
            echo "EXPECTED_WRANGLER_NAME=demo-ffneumarkt-web" >> $GITHUB_ENV
            echo "EXPECTED_ASTRO_SITE=https://demo.ffneumarkt.at" >> $GITHUB_ENV
          else
            echo "Branch $TARGET_BRANCH not configured for validation."
            exit 1
          fi

      - name: Verify "name" in wrangler.jsonc
        run: |
          node -e "
            const fs = require('fs');
            const expectedName = process.env.EXPECTED_WRANGLER_NAME;
            
            try {
              const content = fs.readFileSync('wrangler.jsonc', 'utf8');
              const match = content.match(/\"name\"\s*:\s*\"([^\"]+)\"/);
              
              if (!match) {
                console.error('Error: Could not find a valid \"name\" field in wrangler.jsonc.');
                process.exit(1);
              }
              
              const name = match[1];
              
              if (name !== expectedName) {
                console.error('\nValidation Failed!');
                console.error('Expected: \"name\": \"' + expectedName + '\"');
                console.error('Found:    \"name\": \"' + name + '\"');
                process.exit(1);
              }
              
              console.log('Validation Passed! Name is correctly set to ' + expectedName + '.');
            } catch (err) {
              console.error('Error reading file:', err.message);
              process.exit(1);
            }
          "

      - name: Verify "site" in astro.config.mjs
        run: |
          node -e "
            const fs = require('fs');
            const expectedSite = process.env.EXPECTED_ASTRO_SITE;
            
            try {
              const content = fs.readFileSync('astro.config.mjs', 'utf8');
              const inlineMatch = content.match(/\\bsite\\s*:\\s*['\\\"]([^'\\\"]+)['\\\"]/);
              const constMatch = content.match(/\\bconst\\s+site\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]/);
              const usesSiteVariable = /defineConfig\\s*\\(\\s*\\{[\\s\\S]*\\bsite\\s*,/.test(content)
                || /defineConfig\\s*\\(\\s*\\{[\\s\\S]*\\bsite\\s*:\\s*site\\b/.test(content);

              const site = inlineMatch?.[1] ?? (usesSiteVariable ? constMatch?.[1] : undefined);

              if (!site) {
                console.error('Error: Could not find a valid \"site\" field in astro.config.mjs.');
                process.exit(1);
              }

              if (site !== expectedSite) {
                console.error('\\nValidation Failed!');
                console.error('Expected: site: \"' + expectedSite + '\"');
                console.error('Found:    site: \"' + site + '\"');
                process.exit(1);
              }
              
              console.log('Validation Passed! site is correctly set to ' + expectedSite + '.');
            } catch (err) {
              console.error('Error reading file:', err.message);
              process.exit(1);
            }
          "

      - name: Verify canonical URL is present in Layout.astro
        run: |
          node -e "
            const fs = require('fs');

            try {
              const content = fs.readFileSync('src/layouts/Layout.astro', 'utf8');
              const canonicalTag = '<link rel=\"canonical\" href=\"https://ffneumarkt.at\" />';

              if (process.env.TARGET_BRANCH !== 'master' && !content.includes(canonicalTag)) {
                console.error('Error: Layout.astro must include the canonical link for any non master branch.');
                process.exit(1);
              }

              if (process.env.TARGET_BRANCH === 'master' && content.includes(canonicalTag)) {
                console.error('Error: Layout.astro must not include the canonical link for master branch.');
                process.exit(1);
              }

              console.log('Validation Passed! Canonical link is present in Layout.astro.');
            } catch (err) {
              console.error('Error reading file:', err.message);
              process.exit(1);
            }
          "
